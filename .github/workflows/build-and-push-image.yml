name: Build and Push Backend

# 拓扑定死：GitHub 只负责构建 + 产出 artifact + 推 GHCR。
# 禁止在本仓库任何 workflow 里下载镜像产物到服务器、或执行 docker load / compose up。
# 落服一律走本地三步：
#   download-offline-release.sh → upload-offline-release.sh → install-offline-release.sh
# 详见 docs/开发与部署流程规范.md 与 docs/architecture/main-branch-release-and-deploy-runbook.md
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-build-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  qa:
    name: QA
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run backend verification
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: mvn -B clean verify

      - name: Build backend package
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: mvn -B -pl sism-main -am clean package -Dmaven.test.skip=true -Dmaven.javadoc.skip=true

      - name: Validate Flyway migration naming
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          migration_dir = pathlib.Path("sism-main/src/main/resources/db/migration")
          pattern = re.compile(r"^V([0-9]+(?:\.[0-9]+)?)__.+\.sql$")

          versions = {}
          errors = []

          for file in sorted(migration_dir.glob("V*__*.sql")):
              match = pattern.match(file.name)
              if not match:
                  errors.append(f"Invalid migration filename: {file.name}")
                  continue
              version = match.group(1)
              if version in versions:
                  errors.append(f"Duplicate migration version {version}: {versions[version]} and {file.name}")
              versions[version] = file.name

          if errors:
              print("\\n".join(errors))
              sys.exit(1)

          print(f"Validated {len(versions)} Flyway migration filenames.")
          PY

  prepare-deployment:
    name: Prepare Deployment Bundle
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment assets
        run: |
          bash -n scripts/deployment/validate-docker-host.sh
          bash -n scripts/deployment/validate-compose-config.sh
          scripts/deployment/validate-compose-config.sh

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: backend-stack-${{ github.sha }}
          path: |
            deploy/compose/docker-compose.yml
            deploy/compose/docker-compose.external-db.yml
            deploy/compose/nginx/frontend.conf
            database/seeds
            database/scripts/bootstrap-local-seed-support.sql
            database/scripts/validate-clean-seeds.sql
            scripts/deployment/validate-docker-host.sh
            scripts/deployment/install-offline-release.sh
          retention-days: 7
          compression-level: 0
          overwrite: true

  build-and-push:
    name: Build and Push
    needs: qa
    runs-on: ubuntu-24.04

    outputs:
      backend_image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/sism-backend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image on GitHub runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image and create deployment artifact
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          for tag in "${GITHUB_SHA}" main; do
            for attempt in 1 2 3; do
              if docker push "${IMAGE}:${tag}"; then
                break
              fi
              if [[ "${attempt}" == "3" ]]; then
                exit 1
              fi
              sleep $((attempt * 5))
            done
          done
          docker save "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:main" | gzip -1 > backend-image.tar.gz

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}
          path: backend-image.tar.gz
          retention-days: 7
          compression-level: 0
          overwrite: true
