spring:
  datasource:
    url: jdbc:h2:mem:sism_iam_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false

  # H2 不识别实体上的 columnDefinition="jsonb"（PG 专属），建表语句由本模块
  # 测试自带 schema.sql 提供（jsonb→json），实体注解保持生产定义不动
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  flyway:
    enabled: false

logging:
  level:
    com.sism: INFO
    org.hibernate.SQL: WARN
