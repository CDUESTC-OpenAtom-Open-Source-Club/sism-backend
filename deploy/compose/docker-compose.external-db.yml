services:
  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    networks:
      default:
        aliases:
          - backend
          - backend.dns.podman
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED}
      JAVA_HEAP_SIZE: ${JAVA_HEAP_SIZE:-768m}
      JAVA_METASPACE_SIZE: ${JAVA_METASPACE_SIZE:-128m}
      JAVA_STACK_SIZE: ${JAVA_STACK_SIZE:-512k}
      # 2026-11-27（生产看板 500）：兜底值 20 → 32（与 docker-compose.yml 同口径）。
      # 20 的池在看板父指标归口批量水合 + 指标列表 + 看板汇总并发时会打满
      # （total=20, active=20, idle=0, waiting=24 → SQLTransientConnectionException → 500）。
      # 前端已把该批量水合限流到 6 并发，此处只需给足余量。
      # 生产显式设置 DB_HIKARI_MAX_POOL_SIZE 时以显式值为准。
      DB_HIKARI_MAX_POOL_SIZE: ${DB_HIKARI_MAX_POOL_SIZE:-32}
      DB_HIKARI_MIN_IDLE: ${DB_HIKARI_MIN_IDLE:-5}
      DINGTALK_ENABLED: ${DINGTALK_ENABLED:-false}
      DINGTALK_APP_KEY: ${DINGTALK_APP_KEY:-}
      DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET:-}
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:-}
      DINGTALK_H5_BASE_URL: ${DINGTALK_H5_BASE_URL:-}
      DINGTALK_TODO_CARD_TYPE_KEY: ${DINGTALK_TODO_CARD_TYPE_KEY:-}
      DINGTALK_AGENT_ID: ${DINGTALK_AGENT_ID:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8080"
    volumes:
      - backend_uploads:/root/.sism/uploads
      - backend_exports:/app/exports
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/actuator/health | grep '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:80"
    volumes:
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  backend_uploads:
  backend_exports:

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-production}_default
